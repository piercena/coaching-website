<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Analysis Paralysis Audit | Nick Pierce</title>
  
  <!-- Favicon Meta Tags -->
  <link rel="icon" type="image/png" sizes="32x32" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#F4EFE6] text-zinc-900 selection:bg-[#C4342B] selection:text-white pt-24">

  <!-- INJECTED HEADER -->
  <div id="site-header"></div>

  <!-- MAIN AUDIT SECTION -->
  <main class="py-12 sm:py-20 px-6 max-w-3xl mx-auto w-full flex-grow">
    <div class="bg-white p-8 sm:p-12 rounded-lg border border-zinc-200 shadow-sm space-y-8">
      
      <div class="space-y-3 text-center">
        <span class="text-xs uppercase tracking-widest text-[#C4342B] font-bold">Interactive Diagnostic</span>
        <h1 class="font-serif text-3xl sm:text-4xl font-bold tracking-tight text-zinc-900">Where are you over-analyzing?</h1>
        <p class="text-sm sm:text-base text-zinc-600 max-w-lg mx-auto leading-relaxed">
          Check any of the friction points below that are currently keeping you stuck, then click calculate to determine your execution score.
        </p>
      </div>

      <!-- Audit Form Checklist -->
      <form id="audit-form" class="space-y-4" onsubmit="return false;">
        <label class="flex items-start space-x-3 p-4 rounded-md bg-zinc-50 border border-zinc-200 cursor-pointer hover:border-zinc-400 transition-all">
          <input type="checkbox" name="bottleneck" value="1" class="mt-1 h-4 w-4 rounded border-zinc-300 text-[#C4342B] focus:ring-[#C4342B]">
          <span class="text-sm text-zinc-800"><strong class="font-semibold text-zinc-900">1. Waiting for 100% Certainty:</strong> Delaying a choice because you want guarantees that every outcome will go smoothly.</span>
        </label>

        <label class="flex items-start space-x-3 p-4 rounded-md bg-zinc-50 border border-zinc-200 cursor-pointer hover:border-zinc-400 transition-all">
          <input type="checkbox" name="bottleneck" value="1" class="mt-1 h-4 w-4 rounded border-zinc-300 text-[#C4342B] focus:ring-[#C4342B]">
          <span class="text-sm text-zinc-800"><strong class="font-semibold text-zinc-900">2. Over-Complicating the Setup:</strong> Spending hours planning, organizing, or building elaborate systems before taking actual steps.</span>
        </label>

        <label class="flex items-start space-x-3 p-4 rounded-md bg-zinc-50 border border-zinc-200 cursor-pointer hover:border-zinc-400 transition-all">
          <input type="checkbox" name="bottleneck" value="1" class="mt-1 h-4 w-4 rounded border-zinc-300 text-[#C4342B] focus:ring-[#C4342B]">
          <span class="text-sm text-zinc-800"><strong class="font-semibold text-zinc-900">3. Research as an Escape:</strong> Reading articles, buying books, or asking others for opinions instead of just pulling the trigger.</span>
        </label>

        <label class="flex items-start space-x-3 p-4 rounded-md bg-zinc-50 border border-zinc-200 cursor-pointer hover:border-zinc-400 transition-all">
          <input type="checkbox" name="bottleneck" value="1" class="mt-1 h-4 w-4 rounded border-zinc-300 text-[#C4342B] focus:ring-[#C4342B]">
          <span class="text-sm text-zinc-800"><strong class="font-semibold text-zinc-900">4. Avoiding the Real Work:</strong> Filling your day with safe, minor tasks because the actual challenge feels too big or ambiguous.</span>
        </label>

        <label class="flex items-start space-x-3 p-4 rounded-md bg-zinc-50 border border-zinc-200 cursor-pointer hover:border-zinc-400 transition-all">
          <input type="checkbox" name="bottleneck" value="1" class="mt-1 h-4 w-4 rounded border-zinc-300 text-[#C4342B] focus:ring-[#C4342B]">
          <span class="text-sm text-zinc-800"><strong class="font-semibold text-zinc-900">5. Spinning in Your Head:</strong> Re-running the same scenarios inside your mind over and over without any outside perspective to break the loop.</span>
        </label>

        <!-- Submit Button -->
        <div class="pt-4 text-center">
          <button type="button" id="submit-audit" class="w-full sm:w-auto px-8 py-4 rounded-sm bg-zinc-900 hover:bg-[#C4342B] text-white text-base font-semibold transition-all shadow-sm cursor-pointer">
            Calculate My Results
          </button>
        </div>
      </form>

      <!-- Results Box (Hidden by Default) -->
      <div id="audit-results" class="hidden p-6 sm:p-8 rounded-lg border space-y-4 text-center transition-all">
        <div class="space-y-1">
          <span id="result-tag" class="text-xs font-bold uppercase tracking-widest">Your Diagnostic Result</span>
          <h2 id="result-title" class="font-serif text-xl font-bold text-zinc-900">--</h2>
        </div>
        <p id="result-description" class="text-sm text-zinc-600 max-w-md mx-auto leading-relaxed">--</p>
        <div class="pt-2">
          <a id="result-cta-btn" href="https://cal.com/nicholas-pierce-mcbbsl/30min" target="_blank" rel="noopener noreferrer" class="inline-flex items-center space-x-2 px-8 py-4 rounded-sm font-semibold text-base transition-all shadow-sm">
            <span id="result-cta-text">Book Your Clarity Call</span>
            <!-- Inline SVG Line-art Arrow -->
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </a>
        </div>
      </div>

    </div>
  </main>

  <!-- INJECTED FOOTER -->
  <div id="site-footer"></div>

  <!-- Calculation Script & Component Loader -->
  <script>
    async function loadComponents() {
      try {
        const headerRes = await fetch('header.html');
        document.getElementById('site-header').innerHTML = await headerRes.text();

        const footerRes = await fetch('footer.html');
        document.getElementById('site-footer').innerHTML = await footerRes.text();
      } catch (e) {
        console.error('Error loading layout components:', e);
      }
    }

    loadComponents();

    // Bulletproof global event delegation for mobile menu navigation
    document.addEventListener('click', (e) => {
      const btn = document.getElementById('mobile-menu-btn');
      const menu = document.getElementById('mobile-menu');
  
      if (!btn || !menu) return;
  
      // 1. Toggle menu when clicking the mobile menu button
      if (btn.contains(e.target)) {
        e.stopPropagation();
        menu.classList.toggle('hidden');
        return;
      }
  
      // 2. Close menu when clicking any link inside the mobile menu
      if (menu.contains(e.target) && e.target.closest('a')) {
        menu.classList.add('hidden');
        return;
      }
  
      // 3. Click-away: close menu if open and user clicks outside both menu and button
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.add('hidden');
      }
    });

    const submitBtn = document.getElementById('submit-audit');
    const resultsBox = document.getElementById('audit-results');
    const resultTag = document.getElementById('result-tag');
    const resultTitle = document.getElementById('result-title');
    const resultDescription = document.getElementById('result-description');
    const resultCtaBtn = document.getElementById('result-cta-btn');
    const resultCtaText = document.getElementById('result-cta-text');

    submitBtn.addEventListener('click', () => {
      const checkedCount = document.querySelectorAll('input[name="bottleneck"]:checked').length;
      
      resultsBox.classList.remove('hidden');

      // Reset dynamic classes for Executive Minimalist styling
      resultsBox.className = "p-6 sm:p-8 rounded-lg border space-y-4 text-center transition-all";
      resultCtaBtn.className = "inline-flex items-center space-x-2 px-8 py-4 rounded-sm font-semibold text-base transition-all shadow-sm text-white";

      if (checkedCount === 0) {
        // GREEN (0 out of 5)
        resultsBox.classList.add('bg-emerald-50', 'border-emerald-300');
        resultTag.className = "text-xs font-bold uppercase tracking-widest text-emerald-700";
        resultTitle.textContent = "Score: High Velocity (0 Friction Points)";
        resultDescription.textContent = "Your momentum is entirely clear. You process uncertainty efficiently and translate choices straight into action without getting bogged down.";
        resultCtaText.textContent = "Schedule a Momentum Calibration Call";
        resultCtaBtn.classList.add('bg-emerald-700', 'hover:bg-emerald-800');
      } else if (checkedCount === 1) {
        // YELLOW (1 out of 5)
        resultsBox.classList.add('bg-amber-50', 'border-amber-300');
        resultTag.className = "text-xs font-bold uppercase tracking-widest text-amber-700";
        resultTitle.textContent = "Score: Minor Friction (1 Point Detected)";
        resultDescription.textContent = "You're moving well, but one specific blind spot is quietly bleeding energy. Catching it now prevents a full stall.";
        resultCtaText.textContent = "Fine-Tune Your Execution Speed";
        resultCtaBtn.classList.add('bg-amber-700', 'hover:bg-amber-800');
      } else {
        // RED (2 or more out of 5)
        resultsBox.classList.add('bg-red-50', 'border-red-200');
        resultTag.className = "text-xs font-bold uppercase tracking-widest text-[#C4342B]";
        resultTitle.textContent = `Score: Execution Stall (${checkedCount} Friction Points)`;
        resultDescription.textContent = "You are trapped in a loop of over-analysis and preparation. You need external structure to break the pattern and start executing.";
        resultCtaText.textContent = "Book Your Clarity Call";
        resultCtaBtn.classList.add('bg-[#C4342B]', 'hover:bg-[#a82b23]');
      }

      resultsBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
